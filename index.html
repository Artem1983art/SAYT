<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Молнія ТВ — Прямий ефір</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b0b0e;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        .logo {
            font-size: 2.8rem;
            font-weight: 900;
            color: #ffde00;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(255, 222, 0, 0.5);
        }
        .tagline {
            color: #8a8a93;
            font-size: 1rem;
            margin-top: 5px;
        }
        .container {
            width: 100%;
            max-width: 900px;
            background: #16161c;
            border-radius: 14px;
            overflow: hidden;
            border: 2px solid #23232f;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .player-box {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* Пропорция 16:9 */
            background: #000;
        }
        .player-box iframe, .player-box video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        .info-panel {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            background: #1a1a24;
            border-top: 1px solid #282836;
        }
        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            color: #ff3b3b;
        }
        .live-dot {
            width: 12px;
            height: 12px;
            background-color: #ff3b3b;
            border-radius: 50%;
            box-shadow: 0 0 10px #ff3b3b;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
        .btn {
            background-color: #0088cc;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #0077b3;
        }
        footer {
            margin-top: 30px;
            color: #555562;
            font-size: 0.9rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚡ Молнія ТВ</div>
        <div class="tagline">Цілодобовий анімаційний телеканал</div>
    </header>

    <div class="container">
        <!-- Блок плеера с трансляцией -->
        <div class="player-box">
            <!-- Ссылка на встраивание трансляции из вашего Telegram-канала -->
            <iframe src="https://t.me/iv_k2000?embed=1" allowfullscreen></iframe>
        </div>

        <div class="info-panel">
            <div class="status-badge">
                <div class="live-dot"></div>
                НА ЖИВО В ЕФІРІ
            </div>
            <a href="https://t.me/iv_k2000" target="_blank" class="btn">Відкрити в Telegram</a>
        </div>
    </div>

    <footer>
        &copy; 2026 Молнія ТВ. Усі права захищено.
    </footer>

</body>
</html>
