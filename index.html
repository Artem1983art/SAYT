<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Молнія ТВ — Прямий ефір</title>
    <style>
        body {
            background-color: #0b0c10;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: #1f2833;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 25px;
            border: 1px solid #28313e;
        }
        .header {
            text-align: center;
            padding: 22px 10px 15px 10px;
        }
        .logo {
            font-size: 30px;
            font-weight: 900;
            color: #66fcf1;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(102, 252, 241, 0.4);
        }
        .subtitle {
            color: #c5c6c7;
            font-size: 14px;
        }
        .screen-box {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000000;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            border-top: 2px solid #28313e;
            border-bottom: 2px solid #28313e;
        }
        .screen-text {
            color: #c5c6c7;
            font-size: 16px;
            margin-bottom: 20px;
            max-width: 85%;
        }
        .live-btn {
            background-color: #ff3b30;
            color: white;
            padding: 14px 32px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 700;
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(255, 59, 48, 0.4);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .live-btn:hover {
            background-color: #ff2d1a;
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(255, 59, 48, 0.6);
        }
        .footer-action {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 90%;
            margin-top: 20px;
            padding: 0 10px;
        }
        .live-badge {
            display: flex;
            align-items: center;
            color: #45dfb1;
            font-weight: 700;
            font-size: 14px;
        }
        .live-dot {
            width: 10px;
            height: 10px;
            background-color: #45dfb1;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            box-shadow: 0 0 10px #45dfb1;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }
        .channel-link {
            color: #66fcf1;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }
        .channel-link:hover {
            text-decoration: underline;
        }
        .copyright {
            margin-top: 20px;
            color: #8b9bb4;
            font-size: 12px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="logo">⚡ МОЛНІЯ ТВ</div>
            <div class="subtitle">Цілодобовий анімаційний телеканал</div>
        </div>

        <div class="screen-box">
            <div class="screen-text">Пряма трансляція йде у нашому Telegram-каналі у високій якості.</div>
            <a href="https://t.me/telekanal_molniya" target="_blank" class="live-btn">
                <span>🔴 Дивитися ефір</span>
            </a>
        </div>

        <div class="footer-action">
            <div class="live-badge">
                <span class="live-dot"></span> СТРИМ АКТИВНИЙ 24/7
            </div>
            <a href="https://t.me/telekanal_molniya" target="_blank" class="channel-link">@telekanal_molniya</a>
        </div>
    </div>

    <div class="copyright">
        © 2026 Молнія ТВ. Усі права захищено.
    </div>

</body>
</html>
