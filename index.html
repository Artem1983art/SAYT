<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Молнія ТВ — Цілодобовий анімаційний телеканал</title>
    <style>
        body {
            background-color: #0b0c10;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 850px;
            background: #1f2833;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 20px;
            border: 1px solid #28313e;
        }
        .header {
            text-align: center;
            padding: 20px 10px 15px 10px;
        }
        .logo {
            font-size: 28px;
            font-weight: 900;
            color: #66fcf1;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(102, 252, 241, 0.4);
        }
        .subtitle {
            color: #c5c6c7;
            font-size: 14px;
        }
        .player-box {
            width: 100%;
            height: 500px;
            background: #000;
            position: relative;
            border-top: 2px solid #28313e;
            border-bottom: 2px solid #28313e;
        }
        .player-box iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #0b0c10;
        }
        .footer-action {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 90%;
            margin-top: 15px;
            padding: 0 10px;
        }
        .live-badge {
            display: flex;
            align-items: center;
            color: #45dfb1;
            font-weight: 700;
            font-size: 14px;
        }
        .live-dot {
            width: 10px;
            height: 10px;
            background-color: #45dfb1;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            box-shadow: 0 0 10px #45dfb1;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }
        .btn {
            background-color: #0088cc;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #0077b3;
        }
        .copyright {
            margin-top: 15px;
            color: #8b9bb4;
            font-size: 12px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="logo">⚡ МОЛНІЯ ТВ</div>
            <div class="subtitle">Цілодобовий анімаційний телеканал без реєстрації</div>
        </div>

        <div class="player-box">
            <!-- Встроенный просмотрщик канала, работает прямо в браузере у любого зрителя -->
            <iframe src="https://t.me/s/telekanal_molniya" title="Молнія ТВ Прямий ефір"></iframe>
        </div>

        <div class="footer-action">
            <div class="live-badge">
                <span class="live-dot"></span> ЕФІР НАЖИВО 24/7
            </div>
            <a href="https://t.me/telekanal_molniya" target="_blank" class="btn">Відкрити в Telegram</a>
        </div>
    </div>

    <div class="copyright">
        © 2026 Молнія ТВ. Усі права захищено.
    </div>

</body>
</html>
