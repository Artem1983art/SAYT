<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Молнія ТВ — Прямий ефір</title>
    <style>
        body {
            background-color: #0f1016;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: #181b24;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 20px;
        }
        .header {
            text-align: center;
            padding: 20px 10px 10px 10px;
        }
        .logo {
            font-size: 28px;
            font-weight: 800;
            color: #ffd700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #94a3b8;
            font-size: 14px;
        }
        .player-box {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            position: relative;
        }
        .player-box iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .footer-action {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 90%;
            margin-top: 15px;
            padding: 0 10px;
        }
        .live-badge {
            display: flex;
            align-items: center;
            color: #ff3b30;
            font-weight: 700;
            font-size: 14px;
        }
        .live-dot {
            width: 10px;
            height: 10px;
            background-color: #ff3b30;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            box-shadow: 0 0 8px #ff3b30;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
        .btn {
            background-color: #0088cc;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #0077b3;
        }
        .copyright {
            margin-top: 20px;
            color: #64748b;
            font-size: 12px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="logo">⚡ МОЛНІЯ ТВ</div>
            <div class="subtitle">Цілодобовий анімаційний телеканал</div>
        </div>

        <div class="player-box">
            <!-- Исправленный виджет на правильный юзернейм -->
            <script async src="https://telegram.org/js/telegram-widget.js?22" data-telegram-post="molniyatv/live" data-width="100%"></script>
        </div>

        <div class="footer-action">
            <div class="live-badge">
                <span class="live-dot"></span> НА ЖИВО В ЕФІРІ
            </div>
            <a href="https://t.me/molniyatv" target="_blank" class="btn">Відкрити в Telegram</a>
        </div>
    </div>

    <div class="copyright">
        © 2026 Молнія ТВ. Усі права захищено.
    </div>

</body>
</html>
